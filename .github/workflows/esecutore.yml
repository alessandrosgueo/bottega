# Workflow riusabile della bottega: esecutore.
# Esegue un giro di lavoro per una bottega (preparazione clone, esecuzione, consegna e oracolo).
# Gira solo su chiamata (on: workflow_call) da un workflow chiamante del progetto.
name: esecutore

on:
  workflow_call:
    inputs:
      bottega_repo:
        description: 'Repository della bottega (es. proprietario/bottega)'
        required: true
        type: string
      bottega_ref:
        description: 'Riferimento git della bottega (tag o commit)'
        required: true
        type: string
      runner:
        description: 'Etichette runner in formato JSON per runs-on'
        required: true
        type: string
      bottega:
        description: 'Identificativo della bottega'
        required: true
        type: string
      lavoro:
        description: 'Numero del lavoro da eseguire'
        required: true
        type: string
    secrets:
      BOTTEGA_TOKEN:
        description: 'Token con permessi di scrittura su GitHub per il runner'
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  esecutore:
    runs-on: ${{ fromJSON(inputs.runner) }}
    # Un giro appeso non tiene il runner per sei ore: oltre il tetto GitHub chiude il job, e il distributore conta
    # un tentativo quando trova il lavoro in corso da più di 7 ore.
    timeout-minutes: 300
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: progetto
          fetch-depth: 0
          persist-credentials: false

      - name: Scarica la bottega
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.bottega_repo }}
          ref: ${{ inputs.bottega_ref }}
          token: ${{ secrets.BOTTEGA_TOKEN }}
          path: bottega
          persist-credentials: false

      - name: Esegui il giro dell'esecutore
        working-directory: progetto
        env:
          GH_TOKEN: ${{ secrets.BOTTEGA_TOKEN }}
          BOTTEGA_VARIABILI: ${{ toJSON(vars) }}
          BOTTEGA_CLONE: ${{ github.workspace }}/bottega
          PYTHONPATH: ${{ github.workspace }}/bottega/attrezzi
          LAVORO: ${{ inputs.lavoro }}
          BOTTEGA: ${{ inputs.bottega }}
        # Lo spazio è quello del `.env` del runner (B6-R1): un `env` del passo lo coprirebbe. Senza `.env` (un runner
        # senza esecutore separato) si usa la cartella temporanea del runner.
        run: |
          export BOTTEGA_SPAZIO="${BOTTEGA_SPAZIO:-$RUNNER_TEMP/bottega-spazio}"
          python3 -P -m bottega giro --lavoro "$LAVORO" --bottega "$BOTTEGA"

      - name: Pulisce dopo un giro annullato
        # B7-3: un job annullato da GitHub lascia vivo il modello dell'esecutore e la cartella del giro nello spazio;
        # anche un giro morto senza annullamento (memoria finita) salta il suo `finally`.
        if: ${{ cancelled() || failure() }}
        working-directory: progetto
        env:
          PYTHONPATH: ${{ github.workspace }}/bottega/attrezzi
        run: |
          export BOTTEGA_SPAZIO="${BOTTEGA_SPAZIO:-$RUNNER_TEMP/bottega-spazio}"
          python3 -P -m bottega pulisci
